services:
  db:
    # O `Dockerfile` da raiz passou a ser o da aplicação (deploy no Cloud Run,
    # que procura por ele sem flag). Este serviço é só o browser sqlite-web.
    build:
      context: .
      dockerfile: docker/Dockerfile.sqliteweb
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data

volumes:
  db-data:
    # named volume, não bind-mount: escrita direta do SQLite via bind-mount no
    # Docker Desktop (Windows/Mac) dá "disk I/O error" no meio de transações
    # grandes. Pra pegar o arquivo .db no host, ver README (docker cp).
