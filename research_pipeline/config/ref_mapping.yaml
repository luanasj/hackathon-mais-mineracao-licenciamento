# Mapeamento das tabelas canônicas -> modelo interno de `research_pipeline/refs.py`.
#
# Por que existe: os dois JSONs são produzidos por `scripts/collect_gac.py` e podem mudar de
# forma sem que este pipeline mude. O mapeamento é o ponto único onde essa mudança é absorvida
# — nenhum nome de campo da fonte aparece hardcoded em `refs.py`.
#
# Contrato do bloco `fields:` — é uma PROJEÇÃO, não um esquema:
#   - campo mapeado ausente no registro  -> RefLoadError nomeando arquivo, campo e id
#   - campo da fonte NÃO mapeado         -> ignorado em silêncio
# Hoje o único ignorado é `data_publicacao` (presente nos 417, `dd/mm/yyyy`): o §8 do GOAL.md
# não o usa. É o oposto do `extra="forbid"` dos schemas do patch 7, e de propósito — lá o
# contrato é nosso, aqui a fonte é de terceiro e ganhar um campo novo não pode quebrar a carga.
#
# `meta:` é bloco NOVO, fora do §7 do GOAL.md, e existe porque `data_consulta` não está
# simétrico nos dois arquivos: `municipios_habilitados.json` só o traz POR REGISTRO (417×
# "2026-08-01", nada na raiz) e `consorcios.json` só o traz NA RAIZ. Como
# `ReferenceData.data_consulta` é escalar e vira `meta.refs_data_consulta` no manifesto (§11),
# sem este bloco o lado dos consórcios não teria de onde ser lido nem conferido.

municipios:
  path: data/processed/municipios_habilitados.json
  root: municipios          # chave que contém os registros
  container: dict           # dict (chave = id) | list
  meta:                     # chaves na raiz do arquivo, fora de `root`
    fonte_url: fonte_url
  fields:
    id: codigo_ibge
    nome: municipio
    codigo_ibge: codigo_ibge
    consorcio_id: consorcio_id
    consorcio_nome: consorcio_nome
    nivel_habilitacao: nivel      # string "1"|"2"|"3"|null -> int|None
    situacao_gac: situacao_gac
    status: status                # habilitado | nao_habilitado
    fonte_url: fonte_url
    data_consulta: data_consulta

consorcios:
  path: data/processed/consorcios.json
  root: consorcios
  container: dict
  meta:
    fonte_url: fonte_url
    data_consulta: data_consulta  # só na raiz; não há por registro
  fields:
    id: consorcio_id
    nome: nome
    total_municipios: total_municipios
    municipios: municipios        # lista aninhada; forma em `membro_fields:`
  membro_fields:                  # forma dos registros dentro de `municipios`
    codigo_ibge: codigo_ibge      # o único que vira estado (`Consorcio.membros`)
    nome: municipio               # os três abaixo são redundantes com o registro do
    nivel_habilitacao: nivel      # município e existem aqui só para virar invariante
    status: status                # de conferência — nunca estado duplicado

# Vocabulário fechado do Anexo IV (§6.3). As colunas são localizadas pelo TEXTO do cabeçalho,
# não por posição: uma coluna inserida à esquerda não desloca a leitura, e uma coluna renomeada
# falha alto nomeando o cabeçalho que existe, em vez de ler a coluna vizinha em silêncio.
#
# ⚠️ A planilha é lida com `data_only=True`, e isso é carga estrutural, não preferência.
# A célula PORTE PEQUENO de B4.2 está gravada como FÓRMULA com resultado em cache:
#   <c r="D20" t="str"><f> 20.000 &lt; 200.000 (redação…)</f><v>#ERROR!</v></c>
# Com o default do openpyxl (`data_only=False`) ela devolve o TEXTO DA FÓRMULA, que não contém
# `#ERROR!` e não casa `faixa não expressa` — a sentinela não dispara e um porte-lixo entra como
# válido. O §6.3 do GOAL.md descreve essa célula como *shared string* (`t="s"`); ela é `t="str"`.
tipologias:
  path: data_source/Anexo_IV_Divisao_B_Mineracao_Bahia.xlsx
  aba: Divisão B - Mineração
  aba_matriz: Matriz Porte x PP (Art. 109)   # 3x3 do Art. 109, só para CONFERIR as classes
  linha_cabecalho: 1
  colunas:
    codigo: CÓDIGO
    nome: TIPOLOGIA
    unidade_porte: UNIDADE DE MEDIDA DE PORTE
    porte_pequeno: PORTE PEQUENO
    porte_medio: PORTE MÉDIO
    porte_grande: PORTE GRANDE
    potencial_poluidor: POTENCIAL POLUIDOR
    classe_pequeno: CLASSE (Pequeno)
    classe_medio: CLASSE (Médio)
    classe_grande: CLASSE (Grande)
  esperadas: 17               # 24 linhas úteis - 6 de grupo - 1 de cabeçalho

# Vocabulário de mineral do SIGMINE/ANM. Mesmo arquivo que o resto do projeto usa no join
# espacial, para que `mineral` fale a mesma língua que a camada geográfica.
minerais:
  path: data_source/BA-shapefile/BA.dbf
  coluna: SUBS
  encoding: utf-8             # o .cpg diz UTF-8; latin-1 corrompe os acentuados
  esperados: 169              # distintos em 31.858 linhas

# Contagens do snapshot atual. Ficam aqui, e não como constante em três arquivos, para que
# trocar de snapshot seja uma edição auditável em vez de um número mágico caçado no código.
# `_check_invariants` falha alto quando o arquivo discorda destes valores — é o AC8: o custo
# de descobrir um JSON truncado aqui é zero, no meio de uma tarefa de US$ 3 é a tarefa.
invariantes:
  municipios_esperados: 417
  consorcios_esperados: 29
  soma_total_municipios: 386
